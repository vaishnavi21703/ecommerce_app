<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verified Summary</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      }

      .card {
        width: 100%;
        max-width: 680px;
        padding: 40px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(31, 41, 55, 0.1);
      }

      .success-label {
        display: inline-block;
        margin: 0 0 12px;
        padding: 7px 12px;
        border-radius: 999px;
        background: #ecfdf5;
        color: #047857;
        font-size: 0.8rem;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 30px;
        color: #111827;
        font-size: clamp(2rem, 5vw, 2.6rem);
      }

      h2 {
        margin: 0 0 14px;
        color: #4c1d95;
        font-size: 1.25rem;
      }

      .details {
        display: grid;
        gap: 12px;
        margin: 0 0 28px;
      }

      .detail {
        margin: 0;
        padding: 14px 16px;
        overflow-wrap: anywhere;
        background: #f9fafb;
        border-radius: 10px;
        line-height: 1.6;
      }

      .summary {
        margin: 0;
        padding: 20px;
        background: #f5f3ff;
        border-left: 4px solid #7c3aed;
        border-radius: 10px;
        line-height: 1.8;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .message {
        margin: 0 0 20px;
        padding: 16px 20px;
        background: #fef2f2;
        border-left: 4px solid #dc2626;
        border-radius: 10px;
        line-height: 1.6;
      }

      .back-link {
        display: inline-block;
        margin-top: 28px;
        padding: 13px 22px;
        border-radius: 10px;
        background: #6d28d9;
        color: #ffffff;
        font-weight: bold;
        text-decoration: none;
      }

      .back-link:hover {
        background: #5b21b6;
      }

      .back-link:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="success-label">Verified</p>
      <h1>Verification Successful!</h1>

      <section aria-labelledby="user-details-heading">
        <h2 id="user-details-heading">User Details</h2>
        <div class="details">
          <p class="detail"><strong>Name:</strong> <span id="name"></span></p>
          <p class="detail"><strong>Email:</strong> <span id="email"></span></p>
        </div>
      </section>

      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Your Summary</h2>
        <p class="summary" id="summary"></p>
      </section>

      <a href="about1.html" class="back-link">Back to About Java</a>
    </main>
    <script>
      const storedResult = sessionStorage.getItem("verifiedSummary");

      if (!storedResult) {
        document.querySelector("main").innerHTML = `
          <h1>Verification Result Not Found</h1>
          <p class="message">Submit the form first to see a verification result.</p>
          <a href="test.html" class="back-link">Go to Test</a>
        `;
      } else {
        try {
          const result = JSON.parse(storedResult);
          if (
            typeof result.name !== "string" ||
            typeof result.email !== "string" ||
            typeof result.summary !== "string"
          ) {
            throw new Error("Stored verification data has an invalid shape.");
          }

          document.getElementById("name").textContent = result.name;
          document.getElementById("email").textContent = result.email;
          document.getElementById("summary").textContent = result.summary;
        } catch (error) {
          console.error("Could not read the verification result.", error);
          document.querySelector("main").innerHTML = `
            <h1>Verification Result Could Not Be Read</h1>
            <p class="message">Please return to the form and submit your details again.</p>
            <a href="test.html" class="back-link">Try Again</a>
          `;
        }
      }
    </script>
  </body>
</html>
