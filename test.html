<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Summary Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      }

      .card {
        width: 100%;
        max-width: 600px;
        padding: 40px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(31, 41, 55, 0.1);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #6d28d9;
        font-size: 0.8rem;
        font-weight: bold;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        color: #111827;
        font-size: clamp(2rem, 5vw, 2.6rem);
      }

      .intro {
        margin: 0 0 28px;
        color: #4b5563;
        line-height: 1.7;
      }

      .field {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        outline: 2px solid #7c3aed;
        outline-offset: 1px;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 10px;
        background: #6d28d9;
        color: #ffffff;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .submit-btn:hover {
        background: #5b21b6;
      }

      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #6d28d9;
        font-weight: bold;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .response {
        margin-top: 24px;
        padding: 20px;
        border-radius: 10px;
        line-height: 1.6;
      }

      .response[hidden] {
        display: none;
      }

      .response.error {
        background: #fef2f2;
        border-left: 4px solid #dc2626;
      }

      .response h2 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }

      .response p {
        margin: 8px 0 0;
      }

      .response ul {
        margin: 8px 0 0;
        padding-left: 22px;
      }

      .submit-btn:focus-visible,
      .back-link:focus-visible,
      .response:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Java concept</p>
      <h1>Write Your Summary</h1>
      <p class="intro">
        Write a summary of the Java concept you read. Your entries are
        validated when you submit the form.
      </p>

      <form id="summary-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email ID</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="summary">Summary</label>
          <textarea id="summary" name="summary" rows="6" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Summary</button>
      </form>

      <section id="response" class="response" role="status" aria-live="polite" tabindex="-1" hidden></section>

      <a href="about1.html" class="back-link">Back to About Java</a>
    </main>
    <script>
      const form = document.getElementById("summary-form");
      const response = document.getElementById("response");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = form.elements.name.value.trim();
        const email = form.elements.email.value.trim();
        const summary = form.elements.summary.value.trim();
        const errors = [];

        if (!/^[A-Z]/.test(name) || name.length >= 10) {
          errors.push("Name must start with a capital letter and have fewer than 10 characters.");
        }
        if (!/^[^\s@]+@gmail\.com$/.test(email)) {
          errors.push("Email must be a valid address ending in @gmail.com.");
        }
        if (!summary) {
          errors.push("Summary must not be empty.");
        }

        if (errors.length === 0) {
          try {
            sessionStorage.setItem("verifiedSummary", JSON.stringify({ name, email, summary }));
            window.location.href = "verify.html";
            return;
          } catch (error) {
            console.error("Could not save the verification result for the next page.", error);
            errors.push("The result could not be opened. Please enable browser storage and try again.");
          }
        }

        response.replaceChildren();
        response.className = "response error";

        const heading = document.createElement("h2");
        heading.textContent = "Please Check Your Entries";
        response.append(heading);

        const message = document.createElement("p");
        message.textContent = "Please check the following and try again:";
        const list = document.createElement("ul");
        errors.forEach((error) => {
          const item = document.createElement("li");
          item.textContent = error;
          list.append(item);
        });
        response.append(message, list);

        response.hidden = false;
        response.focus();
      });
    </script>
  </body>
</html>
